"title">erase</span><span class="params">(<span class="type">int</span> x)</span> </span>{ qdel.<span class="built_in">push</span>(x); }</span><br><span class="line">        <span class="function"><span class="keyword">inline</span> <span class="type">int</span> <span class="title">top</span><span class="params">()</span> </span>{ <span class="comment">// Without no_throw</span></span><br><span class="line">            <span class="keyword">while</span> (qadd.<span class="built_in">top</span>() == qdel.<span class="built_in">top</span>())</span><br><span class="line">                qadd.<span class="built_in">pop</span>(), qdel.<span class="built_in">pop</span>();</span><br><span class="line">            <span class="keyword">return</span> qadd.<span class="built_in">top</span>();</span><br><span class="line">        }</span><br><span class="line">    <span class="keyword">private</span>:</span><br><span class="line">        std::priority_queue&lt;<span class="type">int</span>&gt; qadd, qdel;</span><br><span class="line">    } base[N];</span><br><span class="line">    <span class="type">int</span> mx[N &lt;&lt; <span class="number">2</span>], mn[N &lt;&lt; <span class="number">2</span>];</span><br><span class="line">    <span class="type">int</span> flglazy[N]; <span class="comment">// 覆盖次数（加入 +1，删除 -1）</span></span><br><span class="line">    <span class="type">bool</span> flg[N &lt;&lt; <span class="number">2</span>]; <span class="comment">// 是否被覆盖</span></span><br><span class="line">    <span class="type">int</span> modify_pos, modify_l, modify_r, modify_val;</span><br><span class="line">    <span class="type">bool</span> modify_type;</span><br><span class="line">    <span class="function"><span class="type">void</span> <span class="title">upd1</span><span class="params">(<span class="type">int</span> u, <span class="type">int</span> l, <span class="type">int</span> r)</span> </span>{</span><br><span class="line">        <span class="keyword">if</span> (l == r) { ss="keyword">else</span> {</span><br><span class="line">            <span class="type">int</span> mid = (l + r) &gt;&gt; <span class="number">1</span>;</span><br><span class="line">            <span class="keyword">if</span> (modify_l &lt;= mid) <span class="built_in">upd2</span>(u&lt;&lt;<span class="number">1</span>, l, mid);</span><br><span class="line">            <span class="keyword">if</span> (mid &lt; modify_r) <span class="built_in">upd2</span>(u&lt;&lt;<span class="number">1</span>|<span class="number">1</span>, mid<span class="number">+1</span>, r);</span><br><span class="line">            flg[u] = flg[u&lt;&lt;<span class="number">1</span>] &amp;&amp; flg[u&lt;&lt;<span class="number">1</span>|<span class="number">1</span>];</span><br><span class="line">        }</span><br><span class="line">    }</span><br><span class="line">    <span class="function"><span class="keyword">inline</span> <span class="type">void</span> <span class="title">helper_updres</span><span class="params">(QueryRes &amp;q, <span class="type">const</span> QueryRes &amp;x)</span> </span>{</span><br><span class="line">        q.first = std::<span class="built_in">min</span>(q.first, x.first);</span><br><span class="line">        q.second = std::<span class="built_in">max</span>(q.second, x.second);</span><br><span class="line">    }</span><br><span class="line">    <span class="type">int</span> query_l, query_r;</span><br><span class="line">    <span class="function">QueryRes <span class="title">query1</span><span class="params">(<span class="type">int</span> u, <span class="type">int</span> l, <span class="type">int</span> r)</span> </span>{</span><br><span class="line">        <span class="keyword">if</span> (query_l &lt;= l &amp;&amp; r &lt;= query_r) <span class="keyword">return</span> <span class="built_in">QueryRes</span>(mn[u], mx[u]);</span><br><span class="line">        <span class="type">int</span> mid = (l + r) &gt;&gt; <span class="number">1</span>;</span><br><span class="line">        <span class="function">QueryRes <span class="title">res</span><span class="params">(<span class="number">1</span> &lt;&lt; <span class="number">30</span>, <span class="number">0</span>)</span></span>;</span><br><span class="line">        <span class="keyword">if</span> (query_l &lt;= mid) <span class="built_in">helper_updres</span>(res, <span class="built_in">query1</span>(u&lt;&lt;<span class="number">1</span>, l, mid));</span><br><span class="line">        <span class="keyword">if</span> (mid &lt; query_r) <span class="built_in">helper_updres</span>(res, <span class="built_in">query1</span>(u&lt;&lt;<span class="number">1</span>|<span class="number">1</span>, mid<span class="number">+1</span>, r));</span><br><span class="line">        <span class="keyword">return</span> res;</span><br><span class="line">    }</span><br><span class="line">    <span class="function"><span class="type">bool</span> <span class="title">query2</span><span class="params">(<span class="type">int</span> u, <span class="type">int</span> l, <span class="type">int</span> r)</span> </span>{</span><br><span class="line">        <span class="keyword">if</span> (flg[u]) <span class="keyword">return</span> <span class="literal">true</span>; <span class="comment">// 这一整块都合法</span></span><br><span class="line">        <span class="keyword">if</span> (query_l &lt;= l &amp;&amp; r &lt;= query_r) <span class="keyword">return</span> <span class="literal">false</span>;</span><br><span class="line">        <span class="type">int</span> mid = (l + r) &gt;&gt; <span class="number">1</span>;</span><br><span class="line">        <span class="keyword">if</span> (query_l &lt;= mid &amp;&amp; !<span class="built_in">query2</span>(u&lt;&lt;<span class="number">1</span>, l, mid)) <span class="keyword">return</span> <span class="literal">false</span>;</span><br><span class="line">        <span class="keyword">if</span> (mid &lt; query_r &amp;&amp; !<span class="built_in">query2</span>(u&lt;&lt;<span class="number">1</span>|<span class="number">1</span>, mid<span class="number">+1</span>, r)) <span class="keyword">return</span> <span class="literal">false</span>;</span><br><span class="line">        <span class="keyword">return</span> <span class="literal">true</span>;</span><br><span class="line">    }</span><br><span class="line">    </span><br><span class="line">    <span class="comment">/// @brief 更改某一个节点的关键属性</span></span><br><span class="line">    <span class="comment">/// @param u 节点的下标（原顺序，非dfn序）</span></span><br><span class="line">    <span class="comment">/// @param x 设置为`k=x`的关键点</span></span><br><span class="line">    <span class="comment">/// @param f [true] 加入 [false] 删除</span></span><br><span class="line">    <span class="function"><span class="keyword">inline</span> <span class="type">void</span> <span class="title">change</span><span class="params">(<span class="type">int</span> u, <span class="type">int</span> x, <span class="type">bool</span> f)</span> </span>{</span><br><span class="line">        modify_type = f;</span><br><span class="line">        <span class="keyword">while</span> (u &amp;&amp; x &gt;= <span class="number">0</span>) { <span class="comment">// 子树可以直接更新 (dfn 连续)，核心是更新 祖先</span></span><br><span class="line">            modify_pos = dfn[u], modify_val = x;</span><br><span class="line">            <span class="built_in">upd1</span>(<span class="number">1</span>, <span class="number">1</span>, n); <span class="comment">// 更新 u 的最大最小</span></span><br><span class="line">        <span class="meta">#<span class="keyword">define</span> All disdfn + dfn[chain[u].head], disdfn + dfn[chain[u].rear] + 1 <span class="comment">// 当前重链上的所有距离(严格递增，按照 dfn 序)</span></span></span><br><span class="line">            modify_l = std::<span class="built_in">lower_bound</span>(All, dis[u] - x) - disdfn; <span class="comment">// 二分查找在重链上的影响范围</span></span><br><span class="line">            modify_r = std::<span class="built_in">upper_bound</span>(All, dis[u] + x) - disdfn - <span class="number">1</span>;</span><br><span class="line">            modify_val = f ? <span class="number">1</span> : <span class="number">-1</span>;</span><br><span class="line">            <span class="keyword">if</span> (modify_l &lt;= modify_r) <span class="built_in">upd2</span>(<span class="number">1</span>, <span class="number">1</span>, n); <span class="comment">// 更新影响范围</span></span><br><span class="line">        <span class="meta">#<span class="keyword">undef</span> All</span></span><br><span class="line">            x -= dis[fa[chain[u].head]] - dis[u]; <span class="comment">// 减去深度</span></span><br><span class="line">            u = fa[chain[u].head]; <span class="comment">// 跳重链</span></span><br><span class="line">        }</span><br><span class="line">    }</span><br><span class="line"></span><br><span class="line">    <span class="comment">/// @brief 查询 dfn l-r 节点能到达的最远地</span></span><br><span class="line">    <span class="comment">/// @return `(最浅层, 最深层)`</span></span><br><span class="line">    <span class="function"><span class="keyword">inline</span> QueryRes <span class="title">ask</span><span class="params">(<span class="type">int</span> l, <span class="type">int</span> r)</span> </span>{</span><br><span class="line">        query_l = l, query_r = r;</span><br><span class="line">        <span class="keyword">return</span> <span class="built_in">query1</span>(<span class="number">1</span>, <span class="number">1</span>, n);</span><br><span class="line">    }</span><br><span class="line"></span><br><span class="line">    <span class="comment">/// @brief 查询 dfn l-r 节点是否`全部`被关键点覆盖</span></span><br><span class="line">    <span class="function"><span class="keyword">inline</span> <span class="type">bool</span> <span class="title">askcov</span><span class="params">(<span class="type">int</span> l, <span class="type">int</span> r)</span> </span>{</span><br><span class="line">        query_l = l, query_r = r;</span><br><span class="line">        <span class="keyword">return</span> <span class="built_in">query2</span>(<span class="number">1</span>, <span class="number">1</span>, n);</span><br><span class="line">    }</span><br><span class="line">} <span class="keyword">using</span> SegTree::change;</span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span> </span>{</span><br><span class="line">    <span class="built_in">freopen</span>(<span class="string">"secure.in"</span>, <span class="string">"r"</span>, stdin);</span><br><span class="line">    <span class="built_in">freopen</span>(<span class="string">"secure.out"</span>, <span class="string">"w"</span>, stdout);</span><br><span class="line">    <span class="type">int</span> m, q;</span><br><span class="line">    <span class="built_in">scanf</span>(<span class="string">"%d%d%d"</span>, &amp;n, &amp;m, &amp;q);</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">1</span>, u, v, w; i &lt; n; i++) {</span><br><span class="line">        <span class="built_in">scanf</span>(<span class="string">"%d%d%d"</span>, &amp;u, &amp;v, &amp;w);</span><br><span class="line">        edgs[++head[<span class="number">0</span>]] = Edge {u, head[v], w}; head[v] = head[<span class="number">0</span>];</span><br><span class="line">        edgs[++head[<span class="number">0</span>]] = Edge {v, head[u], w}; head[u] = head[<span class="number">0</span>];</span><br><span class="line">    }</span><br><span class="line">    <span class="built_in">dfs1</span>(<span class="number">1</span>, <span class="number">0</span>); <span class="built_in">dfs2</span>(<span class="number">1</span>, <span class="number">1</span>);</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">1</span>; i &lt;= m; i++) {</span><br><span class="line">        <span class="built_in">scanf</span>(<span class="string">"%d%d"</span>, &amp;p[i], &amp;k[i]);</span><br><span class="line">        <span class="built_in">change</span>(p[i], k[i], <span class="literal">true</span>);</span><br><span class="line">    }</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> op, x, y; q--; ) {</span><br><span class="line">        <span class="built_in">scanf</span>(<span class="string">"%d%d"</span>, &amp;op, &amp;x);</span><br><span class="line">        <span class="keyword">switch</span> (op) {</span><br><span class="line">        <span class="keyword">case</span> <span class="number">1</span>: {</span><br><span class="line">            <span class="built_in">scanf</span>(<span class="string">"%d"</span>, &amp;y);</span><br><span class="line">            <span class="built_in">change</span>(x, y, <span class="literal">true</span>);</span><br><span class="line">            ++m, p[m] = x, k[m] = y;</span><br><span class="line">            <span class="keyword">break</span>;</span><br><span class="line">        }</span><br><span class="line">        <span class="keyword">case</span> <span class="number">2</span>: {</span><br><span class="line">            <span class="built_in">change</span>(p[x], k[x], <span class="literal">false</span>);</span><br><span class="line">            <span class="keyword">break</span>;</span><br><span class="line">        }</span><br><span class="line">        }</span><br><span class="line">    }</span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">}</span><br></pre></td></tr></table></figure>
